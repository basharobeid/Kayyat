databases:
  - name: khayyat-db
    plan: free
    databaseName: khayyat
    user: khayyat

services:
  - type: web
    name: khayyat-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: khayyat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_MINUTES
        value: "15"
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: "7"
      - key: PLATFORM_COMMISSION_RATE
        value: "0.12"
      # Update this after the frontend is deployed to Vercel so the browser can call the API.
      - key: CORS_ORIGINS
        value: http://localhost:3000
